# Built-in resource catalogue.
#
# `acquire`  fully-qualified callables that return a managed resource
# `release`  method names that release it
# `context_manager`  true if `with <acquire>(...)` is always safe
# `scarcity` fd | pooled | process | lock  - used for severity ranking
#
# Users extend this via [[leakguard.resources]] in .leakguard.toml.
# When a judge asks "what about my library?", the answer is four lines of TOML.

resources:
  # ---- files ----------------------------------------------------------
  - id: builtins.file
    acquire: ["open", "io.open", "codecs.open", "io.FileIO", "io.BufferedReader"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: tempfile.NamedTemporaryFile
    acquire: ["tempfile.NamedTemporaryFile", "tempfile.TemporaryFile"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: gzip.GzipFile
    acquire: ["gzip.open", "gzip.GzipFile", "bz2.open", "lzma.open"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: zipfile.ZipFile
    acquire: ["zipfile.ZipFile"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: tarfile.TarFile
    acquire: ["tarfile.open", "tarfile.TarFile"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  # ---- databases ------------------------------------------------------
  - id: sqlite3.Connection
    acquire: ["sqlite3.connect"]
    release: ["close"]
    context_manager: true
    severity: high
    scarcity: pooled

  - id: psycopg2.connection
    acquire: ["psycopg2.connect", "psycopg.connect"]
    release: ["close"]
    context_manager: true
    severity: high
    scarcity: pooled

  - id: pymysql.Connection
    acquire: ["pymysql.connect", "MySQLdb.connect"]
    release: ["close"]
    context_manager: true
    severity: high
    scarcity: pooled

  - id: sqlalchemy.Connection
    acquire: ["engine.connect", "sqlalchemy.create_engine"]
    release: ["close", "dispose"]
    context_manager: true
    severity: high
    scarcity: pooled

  - id: redis.Redis
    acquire: ["redis.Redis", "redis.StrictRedis", "redis.ConnectionPool"]
    release: ["close", "disconnect"]
    context_manager: true
    severity: high
    scarcity: pooled

  # ---- network --------------------------------------------------------
  - id: socket.socket
    acquire: ["socket.socket", "socket.create_connection"]
    release: ["close", "shutdown"]
    context_manager: true
    severity: high
    scarcity: fd

  - id: http.client.HTTPConnection
    acquire: ["http.client.HTTPConnection", "http.client.HTTPSConnection"]
    release: ["close"]
    context_manager: false
    severity: medium
    scarcity: fd

  - id: urllib.response
    acquire: ["urllib.request.urlopen"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: requests.Session
    acquire: ["requests.Session", "requests.sessions.Session"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: pooled

  - id: ftplib.FTP
    acquire: ["ftplib.FTP", "ftplib.FTP_TLS"]
    release: ["close", "quit"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: smtplib.SMTP
    acquire: ["smtplib.SMTP", "smtplib.SMTP_SSL"]
    release: ["close", "quit"]
    context_manager: true
    severity: medium
    scarcity: fd

  # ---- processes and concurrency -------------------------------------
  - id: subprocess.Popen
    acquire: ["subprocess.Popen"]
    release: ["wait", "communicate", "kill", "terminate"]
    context_manager: true
    severity: high
    scarcity: process

  - id: multiprocessing.Pool
    acquire: ["multiprocessing.Pool", "multiprocessing.pool.ThreadPool"]
    release: ["close", "terminate", "join"]
    context_manager: true
    severity: high
    scarcity: process

  - id: concurrent.futures.Executor
    acquire:
      ["concurrent.futures.ThreadPoolExecutor", "concurrent.futures.ProcessPoolExecutor"]
    release: ["shutdown"]
    context_manager: true
    severity: high
    scarcity: process

  - id: threading.Lock
    acquire: ["threading.Lock.acquire", "threading.RLock.acquire"]
    release: ["release"]
    context_manager: true
    severity: high
    scarcity: lock

  # ---- misc -----------------------------------------------------------
  - id: shelve.Shelf
    acquire: ["shelve.open"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: dbm
    acquire: ["dbm.open", "dbm.gnu.open", "dbm.ndbm.open"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: mmap.mmap
    acquire: ["mmap.mmap"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd

  - id: wave.Wave_read
    acquire: ["wave.open", "aifile.open", "sunau.open"]
    release: ["close"]
    context_manager: true
    severity: low
    scarcity: fd

  - id: selectors.BaseSelector
    acquire: ["selectors.DefaultSelector", "selectors.EpollSelector"]
    release: ["close"]
    context_manager: true
    severity: medium
    scarcity: fd
