# LeakGuard GitHub Action.
#
# Consumed by other repos as:
#
#   - uses: <org>/leakguard@v0.1.0
#     with:
#       fail-on: definite
#
# MUST live at the repository root for the short `uses:` form to work.
#
# Design rule: the required path (scan -> SARIF -> pass/fail) never depends on
# the optional path (organization control plane). If it is down, CI still behaves
# correctly.

name: LeakGuard
description: Static resource-leak detection for Python, enforced in CI
author: LeakGuard
branding:
  icon: shield
  color: red

inputs:
  paths:
    description: Paths to scan
    required: false
    default: "."
  fail-on:
    description: Minimum confidence that fails the build (definite|likely|possible|never)
    required: false
    default: "definite"
  diff-only:
    description: Only analyze files changed in this PR
    required: false
    default: "true"
  baseline:
    description: Path to the baseline suppression file
    required: false
    default: ".leakguard-baseline.json"
  python-version:
    description: Python version to run the analyzer on
    required: false
    default: "3.11"
  control-plane:
    description: Optional LeakGuard control-plane base URL (for example https://dashboard.example/api/control-plane).
    required: false
    default: ""
  upload-sarif:
    description: Upload SARIF to GitHub code scanning
    required: false
    default: "true"

outputs:
  definite:
    description: Number of definite findings
    value: ${{ steps.scan.outputs.definite }}
  total:
    description: Total findings after baseline filtering
    value: ${{ steps.scan.outputs.total }}
  sarif-file:
    description: Path to the generated SARIF file
    value: leakguard.sarif

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LeakGuard
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"

    - name: Run LeakGuard
      id: scan
      shell: bash
      env:
        LEAKGUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_DIFF_ONLY: ${{ inputs.diff-only }}
      run: |
        set +e
        read -r -a SCAN_PATHS <<< "$INPUT_PATHS"
        DIFF_ARGS=()
        if [ "$INPUT_DIFF_ONLY" = "true" ]; then DIFF_ARGS+=(--diff-only); fi
        leakguard check "${SCAN_PATHS[@]}" \
          --fail-on "$INPUT_FAIL_ON" \
          --baseline "$INPUT_BASELINE" \
          "${DIFF_ARGS[@]}" \
          --format sarif \
          --output leakguard.sarif
        SCAN_CODE=$?
        set -e

        # Second pass for the machine-readable payload. --fail-on=never so
        # this pass cannot itself decide the build outcome.
        leakguard check "${SCAN_PATHS[@]}" \
          --baseline "$INPUT_BASELINE" \
          "${DIFF_ARGS[@]}" \
          --fail-on never \
          --format json \
          --output leakguard.json || true

        export SCAN_CODE
        python - <<'PY'
        import json, os, pathlib
        path = pathlib.Path("leakguard.json")
        payload = json.loads(path.read_text(encoding="utf-8"))
        # Organization telemetry contains evidence metadata, never source text.
        for finding in payload.get("findings", []):
            acquired = finding.get("acquired_at")
            if isinstance(acquired, dict):
                acquired.pop("snippet", None)
        context = payload.setdefault("context", {})
        context["gate_status"] = (
            "passed" if os.environ["SCAN_CODE"] == "0"
            else "blocked" if os.environ["SCAN_CODE"] == "1"
            else "error"
        )
        context["scan_mode"] = "diff" if os.environ["INPUT_DIFF_ONLY"] == "true" else "full"
        path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
        PY

        echo "code=$SCAN_CODE" >> "$GITHUB_OUTPUT"
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, pathlib
        try:
            s = json.loads(pathlib.Path("leakguard.json").read_text())["summary"]
        except Exception:
            s = {}
        print(f"definite={s.get('definite', 0)}")
        print(f"total={s.get('total', 0)}")
        PY

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: leakguard.sarif
        category: leakguard

    # Optional: forward findings to the control plane. Never source code -
    # only path, line, resource type and fingerprint. `|| echo` means an
    # unreachable control plane cannot break the build.
    - name: Notify control plane
      if: always() && inputs.control-plane != ''
      shell: bash
      env:
        LEAKGUARD_SECRET: ${{ env.LEAKGUARD_SECRET }}
        LEAKGUARD_CONTROL_PLANE: ${{ inputs.control-plane }}
      run: |
        if [ -z "${LEAKGUARD_SECRET:-}" ]; then
          echo "LEAKGUARD_SECRET not set; skipping control-plane notify"
          exit 0
        fi
        SIG=$(leakguard sign leakguard.json)
        RESPONSE=$(mktemp)
        HTTP_CODE=$(curl -sS -o "$RESPONSE" -w "%{http_code}" -X POST "${LEAKGUARD_CONTROL_PLANE%/}/ingest" \
          -H "Content-Type: application/json" \
          -H "X-LeakGuard-Signature: $SIG" \
          --max-time 10 \
          -d @leakguard.json || true)
        if [[ "$HTTP_CODE" =~ ^2 ]]; then
          echo "LeakGuard report delivered to control plane."
        else
          echo "::warning::LeakGuard report was not stored by the control plane (HTTP ${HTTP_CODE:-network error}). Dashboard accuracy may be incomplete."
          tr -cd '\11\12\15\40-\176' < "$RESPONSE" | head -c 500 || true
          echo
        fi

    - name: Job summary
      if: always()
      shell: bash
      env:
        SUMMARY_EMPLOYEE: ${{ github.actor }}
        SUMMARY_REPOSITORY: ${{ github.repository }}
        SUMMARY_BRANCH: ${{ github.head_ref || github.ref_name }}
        SUMMARY_SCAN_MODE: ${{ inputs.diff-only == 'true' && 'changed Python files only' || 'full repository' }}
        SUMMARY_DEFINITE: ${{ steps.scan.outputs.definite }}
        SUMMARY_TOTAL: ${{ steps.scan.outputs.total }}
      run: |
        {
          echo "### LeakGuard"
          echo ""
          echo "- employee: @$SUMMARY_EMPLOYEE"
          echo "- repository: $SUMMARY_REPOSITORY"
          echo "- branch: $SUMMARY_BRANCH"
          echo "- scan mode: $SUMMARY_SCAN_MODE"
          echo "- definite: $SUMMARY_DEFINITE"
          echo "- total (after baseline): $SUMMARY_TOTAL"
        } >> "$GITHUB_STEP_SUMMARY"

    # Deliberately last: findings and analyzer failures both block protected
    # branches. A security gate must fail closed if it cannot complete.
    - name: Enforce
      if: steps.scan.outputs.code != '0'
      shell: bash
      env:
        SCAN_CODE: ${{ steps.scan.outputs.code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$SCAN_CODE" = "1" ]; then
          echo "::error::LeakGuard found resource leaks at or above the '$FAIL_ON' threshold"
        else
          echo "::error::LeakGuard could not complete the scan (exit $SCAN_CODE); merge blocked"
        fi
        exit 1
