name: CI

on:
  push:
    branches: [main, P1, P2, P3, P4]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          leakguard --version
          leakguard check --help
          # Exit code contract: clean tree must be 0
          leakguard check leakguard/ --fail-on definite --no-baseline
          # SARIF must be valid JSON
          leakguard check leakguard/ --format sarif --fail-on never | python -m json.tool > /dev/null
          # JSON must be valid JSON
          leakguard check leakguard/ --format json --fail-on never | python -m json.tool > /dev/null

  self-scan:
    # LeakGuard scanning LeakGuard. Non-blocking while the engine is stubbed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          paths: leakguard
          fail-on: definite
          diff-only: "false"
          upload-sarif: "false"
